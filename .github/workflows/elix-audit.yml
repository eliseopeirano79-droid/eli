name: ELIX systematic audit
on:
  push:
    branches: [main, feature/elix-11-systematic-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: elix-systematic-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export reproducible public source snapshot
        run: |
          mkdir -p /tmp/elix-audit
          git archive --format=zip HEAD > /tmp/elix-audit/source.zip
          git rev-parse HEAD > /tmp/elix-audit/commit.txt
      - name: Validate all existing data and features
        run: npm test
      - name: Run systematic browser audit
        run: |
          npm install --prefix /tmp/elix-audit-deps --no-save playwright@1.56.1
          node /tmp/elix-audit-deps/node_modules/playwright/cli.js install --with-deps chromium
          python3 -m http.server 8765 > /tmp/elix-audit/http.log 2>&1 &
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-systematic-audit.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/audit-report.json"))["passed"] is True'
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-content-batch.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/content-batch-report.json"))["passed"] is True'
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-catalog-material.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/catalog-browser-report.json"))["passed"] is True'
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-elix-branding.cjs
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-update-banner.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/update-banner-report.json"))["passed"] is True'
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-eli-release.cjs
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-alphabet-a.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/alphabet-a-browser.json"))["passed"] is True'
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-abc-continuation.cjs
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/abc-continuation-browser.json"))["passed"] is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elix-systematic-audit
          path: /tmp/elix-audit
          if-no-files-found: error
