name: ELIX 0.9 browser regression
on:
  push:
    branches: [feature/elix-09-dose-pk-guidelines]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-backed modules
        run: |
          node --check elix-pharma-labs.js
          node --check evidence-atlas.js
          npm test
      - name: Install browser
        run: |
          npm install --prefix /tmp/elix-09-browser-deps --no-save playwright@1.56.1
          node /tmp/elix-09-browser-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Desktop and mobile
        run: |
          python3 -m http.server 8765 > /tmp/elix-09-http.log 2>&1 &
          PLAYWRIGHT_MODULE=/tmp/elix-09-browser-deps/node_modules/playwright node scripts/browser-pharma09.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elix-09-browser
          path: /tmp/elix-09-browser
          if-no-files-found: ignore
