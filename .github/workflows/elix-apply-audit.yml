name: ELIX apply and verify audit
on:
  push:
    branches: [feature/elix-11-systematic-audit]
    paths:
      - .github/workflows/elix-apply-audit.yml
      - scripts/apply_audit_11.py
      - scripts/.audit-payload-*
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: elix-apply-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-source audit changes
        run: |
          test "${GITHUB_REF_NAME}" = 'feature/elix-11-systematic-audit'
          mkdir -p /tmp/elix-audit
          python3 scripts/apply_audit_11.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-systematic-audit.cjs')
          s=p.read_text()
          before="await page.keyboard.press('Escape');\n assert.equal(await page.locator('dialog').count(),0);"
          after="await page.keyboard.press('Escape');\n await page.waitForSelector('dialog',{state:'detached'});\n assert.equal(await page.locator('dialog').count(),0);"
          assert before in s, 'Native-dialog lifecycle test not found'
          p.write_text(s.replace(before,after))
          PY
          git diff --check
          for file in *.js; do node --check "$file"; done
          npm test | tee /tmp/elix-audit/unit-tests.log
      - name: Install Chromium regression tools
        run: |
          npm install --prefix /tmp/elix-audit-deps --no-save playwright@1.56.1
          node /tmp/elix-audit-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser matrix and interaction checks
        run: |
          python3 -m http.server 8765 > /tmp/elix-audit/http.log 2>&1 &
          PLAYWRIGHT_MODULE=/tmp/elix-audit-deps/node_modules/playwright node scripts/browser-systematic-audit.cjs | tee /tmp/elix-audit/browser.log
          test -s /tmp/elix-audit/audit-report.json
          python3 -c 'import json; assert json.load(open("/tmp/elix-audit/audit-report.json"))["passed"] is True'
      - name: Commit only the verified implementation to the feature branch
        run: |
          git restore --source=HEAD -- .github/workflows
          git rm -f scripts/apply_audit_11.py scripts/.audit-payload-00 scripts/.audit-payload-01 scripts/.audit-payload-02 scripts/.audit-payload-03
          git add -A
          git config user.name 'ELIX Audit Checks'
          git config user.email 'elix-audit@users.noreply.github.com'
          git commit -m 'fix(elix): systematic UX, source accessibility, quiz integrity and offline regression audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git archive --format=zip HEAD > /tmp/elix-audit/source.zip
          git rev-parse HEAD > /tmp/elix-audit/commit.txt
      - name: Capture audit outcome
        if: always()
        run: |
          mkdir -p /tmp/elix-audit
          git status --short > /tmp/elix-audit/worktree.txt
          git diff --stat > /tmp/elix-audit/change-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elix-applied-audit
          path: /tmp/elix-audit
          if-no-files-found: error
