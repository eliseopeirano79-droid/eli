name: ELIX code and data validation
on:
  push:
    branches: [main, feature/elix-alpha-05, feature/elix-06-focus-and-brand, feature/elix-07-deep-scientific-atlas]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog and ELIX modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check evidence-atlas.js
          node --check elix-studio.js
          node --check elix-content.js
          node --check receptors.js
          node --check italian-names.js
          node --check scripts/validate-it-localization.mjs
          node --check elix-expanded-chapters.js
          node --check elix-expanded-questions.js
          node --check elix-deep-drugs.js
          node --check elix-research.js
          node --check elix-rich-reader.js
          node --check elix-targets.js
          node --check elix-extra-cases.js
          node --check scripts/validate-science.mjs
      - name: Run pharmacology data and UI tests
        run: npm test
